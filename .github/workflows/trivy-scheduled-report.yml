name: Weekly Security Report

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  comprehensive-scan:
    name: Weekly Comprehensive Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run comprehensive Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig,license'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
          format: 'table'
          output: 'weekly-report.txt'
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'

      - name: Generate HTML Report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig,license'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
          format: 'template'
          template: '@/contrib/html.tpl'
          output: 'weekly-report.html'
          exit-code: '0'

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: weekly-security-report-${{ github.run_number }}
          path: |
            weekly-report.txt
            weekly-report.html
          retention-days: 90

      - name: Create Issue for High/Critical vulnerabilities
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reportContent = 'No report available';

            try {
              reportContent = fs.readFileSync('weekly-report.txt', 'utf8');
            } catch (e) {
              console.log('Could not read report file');
            }

            const hasHighOrCritical = reportContent.includes('HIGH') || reportContent.includes('CRITICAL');

            if (hasHighOrCritical) {
              const issueTitle = `🔒 Weekly Security Scan - Action Required (${new Date().toISOString().split('T')[0]})`;
              const issueBody = `## Weekly Security Scan Report

              ⚠️ **High or Critical vulnerabilities detected!**

              ### Summary
              The automated weekly security scan has detected vulnerabilities that require attention.

              ### Report
              \`\`\`
              ${reportContent.substring(0, 3000)}
              \`\`\`

              ${reportContent.length > 3000 ? '\n*Report truncated. View full report in workflow artifacts.*\n' : ''}

              ### Actions Required
              1. Review the vulnerabilities in the Security tab
              2. Download the full report from workflow artifacts
              3. Prioritize fixing CRITICAL and HIGH vulnerabilities
              4. Update dependencies where necessary

              ---
              *This issue was automatically created by the Weekly Security Report workflow.*`;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['security', 'automated']
              });
            }